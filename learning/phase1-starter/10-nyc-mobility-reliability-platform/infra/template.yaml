AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Production-patterned infrastructure for the NYC mobility reliability platform.

Parameters:
  ProjectName:
    Type: String
    Default: nyc-mobility-reliability
    AllowedPattern: '^[a-z][a-z0-9-]{2,29}$'
    Description: Lowercase project identifier used in resource names and tags.
  Environment:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z][a-z0-9-]{1,7}$'
    Description: Deployment environment identifier.
  ArtifactBucketName:
    Type: String
    Description: Existing S3 bucket containing Glue scripts and SAM deployment artifacts.
  ArtifactPrefix:
    Type: String
    Default: nyc-mobility-reliability
    MinLength: 1
    Description: Key prefix under the external artifact bucket.
  NotificationEmail:
    Type: String
    Default: ''
    Description: Optional email address for SNS notifications; confirmation is required.
  ScheduleEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Whether the monthly EventBridge schedule is enabled.
  RejectRateThreshold:
    Type: Number
    Default: 0.05
    MinValue: 0
    MaxValue: 1
    Description: Maximum accepted rejected-row fraction before publication fails.
  RawRetentionDays:
    Type: Number
    Default: 365
    MinValue: 1
    Description: Days to retain current raw source object versions.
  QuarantineRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    Description: Days to retain current quarantined objects.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: CloudWatch Logs retention period.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, '']]
  IsScheduleEnabled: !Equals [!Ref ScheduleEnabled, 'true']

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 30
    Tracing: Active
    Tags:
      Project: !Ref ProjectName
      Environment: !Ref Environment
      ManagedBy: cloudformation
      DataClassification: public

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: false
      BucketVersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawData
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: !Ref RawRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: ExpireQuarantineData
            Status: Enabled
            Prefix: quarantine/
            ExpirationInDays: !Ref QuarantineRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: DataClassification
          Value: public

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub '${DataBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub 'nyc_mobility_reliability_${Environment}'
        Description: !Sub 'Athena catalog for ${ProjectName} ${Environment}'

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub '${ProjectName}-${Environment}'
      Description: !Sub 'Governed Athena workgroup for ${ProjectName} ${Environment}'
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: 1073741824
        ResultConfiguration:
          OutputLocation: !Sub 's3://${DataBucket}/athena-results/'
          EncryptionConfiguration:
            EncryptionOption: SSE_S3
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Sub '${ProjectName}-${Environment}'
      TopicName: !Sub '${ProjectName}-${Environment}-pipeline'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  NotificationSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref NotificationTopic

  GlueSecurityConfiguration:
    Type: AWS::Glue::SecurityConfiguration
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-security'
      EncryptionConfiguration:
        S3Encryptions:
          - S3EncryptionMode: SSE-S3

  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DataAndArtifactAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListPipelinePrefixes
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - raw/*
                      - curated/*
                      - quarantine/*
                      - aggregated/*
                      - manifests/*
                      - temporary/*
              - Sid: ReadPipelineData
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub '${DataBucket.Arn}/raw/*'
                  - !Sub '${DataBucket.Arn}/curated/*'
                  - !Sub '${DataBucket.Arn}/quarantine/*'
                  - !Sub '${DataBucket.Arn}/aggregated/*'
                  - !Sub '${DataBucket.Arn}/temporary/*'
              - Sid: WritePipelineData
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource:
                  - !Sub '${DataBucket.Arn}/raw/*'
                  - !Sub '${DataBucket.Arn}/curated/*'
                  - !Sub '${DataBucket.Arn}/quarantine/*'
                  - !Sub '${DataBucket.Arn}/aggregated/*'
                  - !Sub '${DataBucket.Arn}/manifests/*'
                  - !Sub '${DataBucket.Arn}/temporary/*'
              - Sid: ReplaceDerivedData
                Effect: Allow
                Action: s3:DeleteObject
                Resource:
                  - !Sub '${DataBucket.Arn}/curated/*'
                  - !Sub '${DataBucket.Arn}/quarantine/*'
                  - !Sub '${DataBucket.Arn}/aggregated/*'
                  - !Sub '${DataBucket.Arn}/temporary/*'
              - Sid: LocateJobScripts
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}'
                Condition:
                  StringLike:
                    s3:prefix: !Sub '${ArtifactPrefix}/jobs/*'
              - Sid: ReadJobScripts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${ArtifactPrefix}/jobs/*'
        - PolicyName: GlueLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteGlueLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*'
              - Sid: PublishGlueMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: Glue
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  IngestionJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-ingest-tlc'
      Description: Download one bounded TLC source period into immutable S3 keys.
      Role: !GetAtt GlueJobRole.Arn
      GlueVersion: '3.0'
      Command:
        Name: pythonshell
        PythonVersion: '3.9'
        ScriptLocation: !Sub 's3://${ArtifactBucketName}/${ArtifactPrefix}/jobs/ingest_tlc.py'
      MaxCapacity: 0.0625
      MaxRetries: 0
      Timeout: 30
      ExecutionProperty:
        MaxConcurrentRuns: 1
      SecurityConfiguration: !Ref GlueSecurityConfiguration
      DefaultArguments:
        '--enable-metrics': 'true'
        '--TempDir': !Sub 's3://${DataBucket}/temporary/glue/'
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: cloudformation

  RawToCuratedJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-raw-to-curated'
      Description: Validate, quarantine, and publish one curated TLC period.
      Role: !GetAtt GlueJobRole.Arn
      GlueVersion: '5.0'
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !Sub 's3://${ArtifactBucketName}/${ArtifactPrefix}/jobs/raw_to_curated.py'
      WorkerType: G.1X
      NumberOfWorkers: 2
      MaxRetries: 0
      Timeout: 120
      ExecutionClass: STANDARD
      ExecutionProperty:
        MaxConcurrentRuns: 1
      SecurityConfiguration: !Ref GlueSecurityConfiguration
      DefaultArguments:
        '--enable-metrics': 'true'
        '--enable-observability-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--job-language': python
        '--TempDir': !Sub 's3://${DataBucket}/temporary/glue/'
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: cloudformation

  CuratedToAggregateJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-curated-to-aggregate'
      Description: Enrich and aggregate one curated TLC period.
      Role: !GetAtt GlueJobRole.Arn
      GlueVersion: '5.0'
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !Sub 's3://${ArtifactBucketName}/${ArtifactPrefix}/jobs/curated_to_aggregate.py'
      WorkerType: G.1X
      NumberOfWorkers: 2
      MaxRetries: 0
      Timeout: 120
      ExecutionClass: STANDARD
      ExecutionProperty:
        MaxConcurrentRuns: 1
      SecurityConfiguration: !Ref GlueSecurityConfiguration
      DefaultArguments:
        '--enable-metrics': 'true'
        '--enable-observability-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--job-language': python
        '--TempDir': !Sub 's3://${DataBucket}/temporary/glue/'
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: cloudformation

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/states/${ProjectName}-${Environment}-pipeline'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunPipelineJobsAndNotify
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RunDefinedGlueJobs
                Effect: Allow
                Action:
                  - glue:StartJobRun
                  - glue:GetJobRun
                  - glue:GetJobRuns
                  - glue:BatchStopJobRun
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/${IngestionJob}'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/${RawToCuratedJob}'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/${CuratedToAggregateJob}'
              - Sid: PublishPipelineNotifications
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref NotificationTopic
        - PolicyName: StateMachineLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageLogDelivery
                Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  PipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-pipeline'
      Type: STANDARD
      Role: !GetAtt StateMachineRole.Arn
      DefinitionUri: state_machine.asl.json
      DefinitionSubstitutions:
        IngestionJobName: !Ref IngestionJob
        RawToCuratedJobName: !Ref RawToCuratedJob
        CuratedToAggregateJobName: !Ref CuratedToAggregateJob
        DataBucketName: !Ref DataBucket
        RejectRateThreshold: !Ref RejectRateThreshold
        NotificationTopicArn: !Ref NotificationTopic
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
        IncludeExecutionData: true
        Level: ERROR
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: cloudformation

  LauncherFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartPipelineAndWriteLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: StartOnlyThisPipeline
                Effect: Allow
                Action: states:StartExecution
                Resource: !Ref PipelineStateMachine
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-${Environment}-start-pipeline:*'
              - Sid: CreateFunctionLogGroup
                Effect: Allow
                Action: logs:CreateLogGroup
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-${Environment}-start-pipeline'
              - Sid: PublishTracingSegments
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  LauncherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-start-pipeline'
      Description: Validate and launch a deterministic monthly mobility pipeline execution.
      CodeUri: ../src/lambdas/start_pipeline/
      Handler: handler.lambda_handler
      Role: !GetAtt LauncherFunctionRole.Arn
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref PipelineStateMachine
          PROJECT_NAME: !Sub '${ProjectName}-${Environment}'
          LOG_LEVEL: INFO

  LauncherFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: LauncherFunction
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-start-pipeline'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  MonthlySchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-monthly'
      Description: Launch the previous calendar month on the tenth day of each month.
      ScheduleExpression: cron(0 10 10 * ? *)
      State: !If [IsScheduleEnabled, ENABLED, DISABLED]
      Targets:
        - Arn: !GetAtt LauncherFunction.Arn
          Id: StartPipelineLambda
          Input: '{"mode":"monthly"}'

  AllowEventBridgeInvokeLauncher:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LauncherFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonthlySchedule.Arn

Outputs:
  DataBucketName:
    Description: Retained S3 bucket containing source, curated, aggregate, and query data.
    Value: !Ref DataBucket
  GlueDatabaseName:
    Description: Glue Data Catalog database used by Athena external tables.
    Value: !Ref GlueDatabase
  AthenaWorkGroupName:
    Description: Athena workgroup enforcing the 1 GiB per-query scan cutoff.
    Value: !Ref AthenaWorkGroup
  NotificationTopicArn:
    Description: SNS topic receiving pipeline success and failure notifications.
    Value: !Ref NotificationTopic
  LauncherFunctionName:
    Description: Lambda function invoked for manual or scheduled pipeline launches.
    Value: !Ref LauncherFunction
  LauncherFunctionArn:
    Description: ARN of the pipeline launcher Lambda function.
    Value: !GetAtt LauncherFunction.Arn
  PipelineStateMachineArn:
    Description: ARN of the Standard Step Functions workflow.
    Value: !Ref PipelineStateMachine
  IngestionJobName:
    Description: Glue Python Shell ingestion job name.
    Value: !Ref IngestionJob
  RawToCuratedJobName:
    Description: Glue 5.0 raw-to-curated Spark job name.
    Value: !Ref RawToCuratedJob
  CuratedToAggregateJobName:
    Description: Glue 5.0 curated-to-aggregate Spark job name.
    Value: !Ref CuratedToAggregateJob
  ArtifactJobsUri:
    Description: External artifact prefix from which Glue loads job scripts.
    Value: !Sub 's3://${ArtifactBucketName}/${ArtifactPrefix}/jobs/'
  MonthlyScheduleState:
    Description: Requested deployment state of the monthly EventBridge rule.
    Value: !If [IsScheduleEnabled, ENABLED, DISABLED]
